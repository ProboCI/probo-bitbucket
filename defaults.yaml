# Port for the server to listen on
port: 3012
hostname: 0.0.0.0

bbWebhookUrl: '/bitbucket-webhook'
# Bitbucket client key and client secret. These are generated for you
# when you create a new OAuth client in Bitbucket
# bbClientKey: 
# bbClientSecret: 
# bbAccessToken: 
# bbRefreshToken: 

# Settings for the API or Container Manager server
# port
api:
  url: "http://localhost:3020"

# Optional file-based logging with daily rotation.
# When enabled, logs are written ONLY to the configured file —
# stdout/stderr logging is disabled.
logFile:
  enabled: false
  path: ./logs/bitbucket-handler.log
  period: 1d
  count: 7
